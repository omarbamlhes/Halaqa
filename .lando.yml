name: fullstack-drupal-task
recipe: drupal10
config:
  webroot: web
  database: mysql
  php: '8.2'
  xdebug: true
services:
  appserver:
    xdebug: true
    config:
      php: |
        memory_limit = 512M
        upload_max_filesize = 100M
        post_max_size = 100M
tooling:
  drush:
    service: appserver
    cmd: vendor/bin/drush
    dir: /app/web
  composer:
    service: appserver
    cmd: composer
