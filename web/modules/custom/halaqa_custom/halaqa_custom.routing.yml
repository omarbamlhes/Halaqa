halaqa_custom.front:
  path: '/welcome'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\LandingPageController::frontPage'
    _title: 'Welcome to Halaqa'
  requirements:
    _permission: 'access content'

halaqa_custom.example:
  path: '/halaqa-custom/example'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::example'
    _title: 'Example'
  requirements:
    _permission: 'access content'

halaqa_custom.halaqa_students:
  path: '/halaqa/{nid}/students'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::students'
    _title_callback: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::studentsTitle'
  requirements:
    _role: 'teacher+administrator'
    nid: '\d+'

halaqa_custom.my_halaqas:
  path: '/my-halaqas'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::myHalaqas'
    _title: 'My Halaqas'
  requirements:
    _role: 'teacher+administrator'

halaqa_custom.teacher_dashboard:
  path: '/teacher/dashboard'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::dashboard'
    _title: 'Teacher Dashboard'
  requirements:
    _role: 'teacher+administrator'

halaqa_custom.add_memorization_record:
  path: '/teacher/add-record'
  defaults:
    _form: '\Drupal\halaqa_custom\Form\MemorizationRecordForm'
    _title: 'Add Memorization Record'
  requirements:
    _role: 'teacher+administrator'

halaqa_custom.add_memorization_record_halaqa:
  path: '/halaqa/{halaqa_nid}/add-record'
  defaults:
    _form: '\Drupal\halaqa_custom\Form\MemorizationRecordForm'
    _title: 'Add Memorization Record'
  requirements:
    _role: 'teacher+administrator'
    halaqa_nid: '\d+'

halaqa_custom.student_progress:
  path: '/student/{student_nid}/progress'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::studentProgress'
    _title_callback: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::studentProgressTitle'
  requirements:
    _role: 'teacher+administrator'
    student_nid: '\d+'

halaqa_custom.parent_dashboard:
  path: '/parent/dashboard'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::parentDashboard'
    _title: 'Parent Dashboard'
  requirements:
    _role: 'parent+administrator'

halaqa_custom.parent_child_progress:
  path: '/parent/child/{student_nid}/progress'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::parentChildProgress'
    _title: 'Child Progress'
  requirements:
    _role: 'parent+administrator'
    student_nid: '\d+'

halaqa_custom.student_dashboard:
  path: '/student/dashboard'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::studentDashboard'
    _title: 'My Progress'
  requirements:
    _role: 'student+administrator'

halaqa_custom.charts_demo:
  path: '/charts-demo'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\ChartsController::chartsDemo'
    _title: 'Charts Demo'
  requirements:
    _permission: 'access content'

halaqa_custom.user_profile:
  path: '/profile'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\ProfileController::userProfile'
    _title: 'My Profile'
  requirements:
    _user_is_logged_in: 'TRUE'

halaqa_custom.user_profile_edit:
  path: '/profile/edit'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\ProfileController::editProfile'
    _title: 'Edit Profile'
  requirements:
    _user_is_logged_in: 'TRUE'
