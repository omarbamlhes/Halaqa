halaqa_custom.example:
  path: '/halaqa-custom/example'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::example'
    _title: 'Example'
  requirements:
    _permission: 'access content'

halaqa_custom.halaqa_students:
  path: '/halaqa/{nid}/students'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::students'
    _title_callback: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::studentsTitle'
  requirements:
    _role: 'teacher+administrator'
    nid: '\d+'

halaqa_custom.my_halaqas:
  path: '/my-halaqas'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::myHalaqas'
    _title: 'My Halaqas'
  requirements:
    _role: 'teacher+administrator'

halaqa_custom.teacher_dashboard:
  path: '/teacher/dashboard'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::dashboard'
    _title: 'Teacher Dashboard'
  requirements:
    _role: 'teacher+administrator'

halaqa_custom.add_memorization_record:
  path: '/teacher/add-record'
  defaults:
    _form: '\Drupal\halaqa_custom\Form\MemorizationRecordForm'
    _title: 'Add Memorization Record'
  requirements:
    _role: 'teacher+administrator'

halaqa_custom.add_memorization_record_halaqa:
  path: '/halaqa/{halaqa_nid}/add-record'
  defaults:
    _form: '\Drupal\halaqa_custom\Form\MemorizationRecordForm'
    _title: 'Add Memorization Record'
  requirements:
    _role: 'teacher+administrator'
    halaqa_nid: '\d+'

halaqa_custom.student_progress:
  path: '/student/{student_nid}/progress'
  defaults:
    _controller: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::studentProgress'
    _title_callback: '\Drupal\halaqa_custom\Controller\HalaqaCustomController::studentProgressTitle'
  requirements:
    _role: 'teacher+administrator'
    student_nid: '\d+'
