<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>
  
  <!-- Open Book Shape -->
  <g fill="#ffffff">
    <!-- Left Page -->
    <path d="M25 30 Q25 65 50 70 Q25 65 25 30" fill="#ffffff" opacity="0.9"/>
    <!-- Right Page -->
    <path d="M75 30 Q75 65 50 70 Q75 65 75 30" fill="#ffffff" opacity="0.9"/>
    <!-- Spine -->
    <line x1="50" y1="25" x2="50" y2="70" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
    <!-- Decorative Lines Left -->
    <line x1="30" y1="38" x2="45" y2="40" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="46" x2="45" y2="48" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="54" x2="45" y2="56" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Decorative Lines Right -->
    <line x1="55" y1="40" x2="70" y2="38" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="55" y1="48" x2="70" y2="46" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="55" y1="56" x2="70" y2="54" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Star Decoration -->
  <path d="M50 18 L52 24 L58 24 L53 28 L55 34 L50 30 L45 34 L47 28 L42 24 L48 24 Z" 
        fill="#fbbf24" opacity="0.9"/>
</svg>

