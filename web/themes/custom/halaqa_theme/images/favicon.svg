<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Circle with shadow -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Decorative ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  
  <!-- Open Quran Book -->
  <g transform="translate(50, 52)">
    <!-- Left Page -->
    <path d="M-22 -18 Q-22 18 0 22 L0 -22 Q-22 -18 -22 -18" fill="#ffffff" opacity="0.95"/>
    <!-- Right Page -->
    <path d="M22 -18 Q22 18 0 22 L0 -22 Q22 -18 22 -18" fill="#ffffff" opacity="0.95"/>
    <!-- Center spine glow -->
    <rect x="-1" y="-22" width="2" height="44" fill="#0d9488" opacity="0.3" rx="1"/>
    
    <!-- Arabic calligraphy style lines - Left -->
    <path d="M-18 -10 Q-12 -8 -6 -10" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M-16 -2 Q-10 0 -6 -2" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M-17 6 Q-11 8 -6 6" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Arabic calligraphy style lines - Right -->
    <path d="M18 -10 Q12 -8 6 -10" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M16 -2 Q10 0 6 -2" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M17 6 Q11 8 6 6" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Golden Star -->
  <g transform="translate(50, 18)">
    <path d="M0 -10 L2.5 -3 L10 -3 L4 2 L6 10 L0 5 L-6 10 L-4 2 L-10 -3 L-2.5 -3 Z" 
          fill="url(#goldGrad)" opacity="0.95"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="20" cy="50" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="80" cy="50" r="2" fill="#ffffff" opacity="0.4"/>
</svg>
