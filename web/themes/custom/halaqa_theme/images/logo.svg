<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(5, 5)">
    <circle cx="25" cy="25" r="23" fill="url(#logoGrad)"/>
    <!-- Book -->
    <g fill="#ffffff" transform="translate(25, 25) scale(0.45) translate(-50, -50)">
      <path d="M25 30 Q25 65 50 70 Q25 65 25 30" opacity="0.9"/>
      <path d="M75 30 Q75 65 50 70 Q75 65 75 30" opacity="0.9"/>
      <line x1="50" y1="25" x2="50" y2="70" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    </g>
    <!-- Star -->
    <path d="M25 6 L26.5 10 L31 10 L27.5 13 L29 17 L25 14 L21 17 L22.5 13 L19 10 L23.5 10 Z" 
          fill="#fbbf24" opacity="0.9" transform="scale(0.6) translate(16, 5)"/>
  </g>
  
  <!-- Text: حلقة -->
  <text x="60" y="40" 
        font-family="Tajawal, Cairo, sans-serif" 
        font-size="28" 
        font-weight="700" 
        fill="#0d9488">
    حلقة
  </text>
  
  <!-- Tagline -->
  <text x="60" y="54" 
        font-family="Tajawal, Cairo, sans-serif" 
        font-size="10" 
        font-weight="400" 
        fill="#6b7280">
    منصة تحفيظ القرآن الكريم
  </text>
</svg>

